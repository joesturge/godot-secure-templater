name: Integration Smoke

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      godot_version:
        description: Godot version passed to gst create
        required: true
        default: '4.7'
        type: string

permissions:
  contents: read

jobs:
  gst-smoke:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows host -> windows target (bash smoke)
            runner: windows-latest
            goos: windows
            goarch: amd64
            target_tuple: windows/amd64
            binary_ext: .exe
            smoke_shell: bash
            sanitize_host_env: 'true'
          - name: windows host -> windows target (pwsh smoke)
            runner: windows-latest
            goos: windows
            goarch: amd64
            target_tuple: windows/amd64
            binary_ext: .exe
            smoke_shell: pwsh
            sanitize_host_env: 'true'
          - name: linux host -> linux target
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            target_tuple: linux/amd64
            binary_ext: ""
            smoke_shell: bash
            sanitize_host_env: 'false'

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - name: Install Linux host dependencies
        if: ${{ matrix.goos == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config

      - name: Build CLI
        run: |
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o "dist/gst${{ matrix.binary_ext }}" ./cmd/gst

      - name: Run integration smoke test
        if: ${{ matrix.smoke_shell == 'bash' }}
        env:
          GST_GODOT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.godot_version || '4.7' }}
        run: |
          bash .github/scripts/integration-smoke.sh "." "./dist/gst${{ matrix.binary_ext }}" "$GST_GODOT_VERSION" "${{ matrix.target_tuple }}" ".github/fixtures/integration-project" "${{ matrix.sanitize_host_env }}"

      - name: Run integration smoke test (PowerShell matrix)
        if: ${{ matrix.smoke_shell == 'pwsh' }}
        shell: pwsh
        env:
          GST_GODOT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.godot_version || '4.7' }}
        run: |
          bash .github/scripts/integration-smoke.sh "." "./dist/gst${{ matrix.binary_ext }}" "$env:GST_GODOT_VERSION" "${{ matrix.target_tuple }}" ".github/fixtures/integration-project" "${{ matrix.sanitize_host_env }}"